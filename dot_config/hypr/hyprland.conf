# https://wiki.hyprland.org/Configuring/
# Omarchy defaults
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf

# Non-Omarchy
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/plugins.conf

# Mouse pointer
# Xcursor Sizes: 16 20 22 24 28 32 40 48 56 64 72 80 88 96
# 1.1 Set envs for apps
env = XCURSOR_THEME,BreezeX-RosePine
env = XCURSOR_SIZE,32

# 1.2 Hyprcursor
env = HYPRCURSOR_THEME,BreezeX-RosePine-Hyprcursor
env = HYPRCURSOR_SIZE,32

# 1.3 Fix for QT apps
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_FORCE_DPI,96

# 2. Set pointer for the Hyprland compositor itself (overrides!)
exec-once = hyprctl setcursor BreezeX-RosePine-Hyprcursor 32

# 3. Set for GTK apps
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'BreezeX-RosePine'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 32

# Opacity
windowrule = opacity 1 1, match:class .*
# windowrule = opacity 1 0.85, match:class .*

# Floating windows rule
windowrule = size 1120 773, match:tag floating-window
# Floating btop rule
windowrule = tag +floating-btop, match:class (org.omarchy.btop)
windowrule = size 980 870, match:tag floating-btop
# normal steam
windowrule = float off, match:class steam

# Set scratchpad as scrolling
workspace = special:scratchpad, layout:scrolling

# Prevent Zed from forcing focus accross workspaces
windowrule = match:class ^(dev\.zed\.Zed)$, suppress_event activatefocus

# No closing terminals
# windowrule {
#   name = nocloser
#   match:initial_class = (com.mitchellh.ghostty|org.omarchy.nvim|foot|Alacritty)
#   no_close_for = 1000000000
# }

# windowrule = workspace 5, class:qemu

ecosystem {
  no_donation_nag = true
}
