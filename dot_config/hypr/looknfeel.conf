$activeBorderColor = rgba(33ccffAA) rgba(00ff99AA) 225deg
$inactiveBorderColor = rgba(595959ff)

# Mouse pointer
# Xcursor Sizes: 16 20 22 24 28 32 40 48 56 64 72 80 88 96
# 1.1 Set envs for apps
env = XCURSOR_THEME,BreezeX-RosePine
env = XCURSOR_SIZE,32

# 1.2 Hyprcursor
env = HYPRCURSOR_THEME,BreezeX-RosePine-Hyprcursor
env = HYPRCURSOR_SIZE,32

# 1.3 Fix for QT apps
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_FORCE_DPI,96

# 2. Set pointer for the Hyprland compositor itself (overrides!)
exec-once = hyprctl setcursor BreezeX-RosePine-Hyprcursor 32

# 3. Set for GTK apps
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'BreezeX-RosePine'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 32

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = -1
    gaps_out = 1
    border_size = 2

    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    # layout = master
}

dwindle {
  force_split = 0
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Round window corners
    rounding = 8
    rounding_power = 3

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = 0xee1a1a1a
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        special = true
        brightness = 0.28
        contrast = 0.85
        vibrancy = 0.083
        noise = 0.0135
    }
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    single_window_aspect_ratio = 13 9
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor

    groupbar {
        font_size = 15
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 3.6, almostLinear
    animation = borderangle, 0,
    animation = windows, 1, 4.5, easeOutQuint
    animation = windowsIn, 1, 2.68, easeOutQuint, popin 84%
    animation = windowsOut, 1, 1.41, linear, popin 77%
    animation = fade, 1, 3.03, quick
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2.74, easeInOutCubic
    animation = specialWorkspaceIn, 1, 4.90, easeOutQuint, slidevert 13%
    animation = specialWorkspaceOut, 1, 4.15, easeOutQuint, slidevert 6%
}

cursor {
  inactive_timeout = 5
}

misc {
  font_family = monospace
}
