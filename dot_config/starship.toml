add_newline = true
command_timeout = 200
format = "[$directory$all]($style)$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](cyan)"

[directory]
truncate_to_repo = false
truncation_length = 5
format = "[$path](cyan)  "
read_only = " 󰌾"

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"
symbol = " "

[git_status]
format = '[$all_status](cyan bold) '
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "?"
modified = " "
stashed = " "
staged = " "
renamed = " "
deleted = "󰵃 "

