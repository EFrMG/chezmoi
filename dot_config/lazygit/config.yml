gui:
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
    authorColors:
      "*": "#b4befe"
  nerdFontsVersion: "3"
git:
  overrideGpg: true
os:
  copyToClipboardCmd: >-
    if [ -n "$TMUX" ]; then

      printf %s {{text}} | tmux load-buffer -w -
    elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then

      printf %s {{text}} | wl-copy 2>/dev/null
    else

      printf '\033]52;c;%s\a' "$(printf %s {{text}} | base64 -w0)"
    fi
