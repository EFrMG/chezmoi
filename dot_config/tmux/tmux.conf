# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf
bind C-q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
bind -n M-s copy-mode
bind -n M-p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind C-h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind C-v split-window -h -c "#{pane_current_path}"
bind x kill-pane
bind C-x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind C-r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind C-c new-window -c "#{pane_current_path}"
bind -n C-S-Space new-window -c "#{pane_current_path}"
bind -n M-Space new-window -c "#{pane_current_path}"
bind -n C-M-Space new-window -c "#{pane_current_path}"
bind k unlink-window
bind C-k unlink-window

bind C-S-Left swap-window -t -1
bind C-S-Right swap-window -t +1
bind -n C-S-Left previous-window
bind -n C-S-Right next-window
bind C-p previous-window
bind -n C-Tab previous-window
bind C-n next-window
bind -n C-M-Tab next-window
bind a last-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -s extended-keys on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set-option -g display-time 1700

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}/$#{pane_current_command}'


# Theme
setw -g clock-mode-colour 6
set -g status-style "bg=#181825,fg=default"
set -g status-left "#{?client_prefix,#[fg=4]║,#[fg=0]║}#[fg=#7e8785,bg=default] #S #{?client_prefix,#[fg=4]║,#[fg=0]║}"
set -g status-right "#{?client_prefix,#[fg=4]║ ,#[fg=0]║ }#[fg=#7e8785]#h #{?client_prefix,#[fg=4]║,#[fg=0]║}"
set -g window-status-format "#[fg=#7e8785] #I·#W "
set -g window-status-current-format "#[fg=#94e2d5] #I·#W "
set -g pane-border-style "fg=#7e8785"
set -g pane-active-border-style "fg=4"
set -g message-style "bg=#181825,fg=4"
set -g message-command-style "bg=#181825,fg=4"
set -g mode-style "bg=#cba6f7,fg=#181825"
set -g status-justify centre

# List of plugins
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
set -g @plugin "tmux-plugins/tpm"

set -g @plugin "tmux-plugins/tmux-resurrect"
# prefix + s Save session
# prefix + Ctrl + r Reload session

set -g @plugin "tmux-plugins/tmux-logging"
set -g @logging-path "$HOME/.tmux/tmux-log"
set -g @screen-capture-path "$HOME/.tmux/tmux-log"
set -g @save-complete-history-path "$HOME/.tmux/tmux-log"
# prefix + P Start / Stop logging pane
# prefix + Alt + p Screen capture
# prefix + Alt + P Save complete history
# prefix + Alt + c Clear history

# set -g @plugin 'sainnhe/tmux-fzf'
# prefix + F

# Initialize Tmux plugin manager (at the bottom!)
run "~/.tmux/plugins/tpm/tpm"
# prefix + I Install
# prefix + U Update
# prefix + alt + u Uninstall those not on the plugin list
